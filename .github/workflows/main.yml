---
name: Production release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Log toolchain
        run: node -e "console.log({node:process.version,npm:process.env.npm_config_user_agent,platform:process.platform,arch:process.arch})"

      - name: Lint with zero warnings
        run: npm run lint

      - name: Check all JavaScript syntax
        run: npm run syntax

      - name: Validate extension build inputs
        run: npm run build

      - name: Verify architecture boundaries
        run: npm run verify:architecture

      - name: Verify documentation, accessibility, and packaged assets
        run: npm run verify:polish

      - name: Verify version state
        run: npm run verify:version

      - name: Audit runtime dependency graph
        run: npm run audit:runtime

      - name: Audit development dependency graph
        run: npm run audit:dev

  extension-tests:
    name: Extension tests (${{ matrix.os }}, VS Code ${{ matrix.vscode }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vscode: 1.99.0
            label: core
          - os: ubuntu-24.04
            vscode: 1.132.0
            label: core
          - os: windows-2025
            vscode: 1.132.0
            label: smoke
          - os: macos-15
            vscode: 1.132.0
            label: smoke
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
      VSCODE_TEST_LABEL: ${{ matrix.label }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Log test runtime
        run: node -e "console.log({node:process.version,platform:process.platform,arch:process.arch,vscode:process.env.VSCODE_TEST_VERSION,label:process.env.VSCODE_TEST_LABEL})"

      - name: Run deterministic extension suite
        run: npm test

      - name: Prove the real test entrypoint rejects zero tests
        run: npm run test:zero-guard

  package:
    name: Reproducible VSIX
    needs: [quality, extension-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source in a fresh job
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and verify byte-reproducible VSIX twice
        id: package
        env:
          M9_REQUIRE_CLEAN: 1
          M9_SOURCE_SHA: ${{ github.sha }}
        run: npm run package -- --github-output "$GITHUB_OUTPUT"

      - name: Re-verify artifact and sidecars before handoff
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        run: npm run package:verify -- --expected-source-sha "$EXPECTED_SOURCE_SHA" --require-publishable "$VSIX_PATH"

      - name: Upload exact verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.vsix_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.provenance_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release-gate:
    name: Release gate
    needs: [quality, extension-tests, package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release input to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.extension-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" || "$PACKAGE_RESULT" != "success" ]]; then
            echo "A required release input failed, was canceled, or was skipped."
            exit 1
          fi
          echo "Every required release input succeeded."
