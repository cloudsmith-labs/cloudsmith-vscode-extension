---
name: Manual deep quality

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2

jobs:
  core-mutation:
    name: Core mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release-quality contracts
        run: npm run verify:quality

      - name: Run core mutation
        run: npm run test:mutation:core

      - name: Upload core mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-mutation-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .quality/mutation/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  black-box-ui-boundary:
    name: Black-box UI - BLOCKED (no SecretStorage authorization)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record blocked black-box evidence
        run: |
          set +e
          node scripts/quality/run-ui-smoke.js
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "The fail-closed UI boundary did not return its blocked status."
            exit 1
          fi
          echo "### Black-box UI BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "No UI automation ran and no live acceptance is claimed. Automated VS Code SecretStorage access is outside this task authorization." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blocked UI receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: black-box-ui-blocked-${{ github.sha }}-${{ github.run_attempt }}
          path: .quality/ui/result.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
